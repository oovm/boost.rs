[package]
name = "data-text-crystal"
version.workspace = true
authors.workspace = true
description = "Crystal language parser with support for modern Crystal syntax and Ruby-like features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "crystal", "ruby-like", "compiled"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
