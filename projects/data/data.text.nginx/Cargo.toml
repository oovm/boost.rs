[package]
name = "data-text-nginx"
version.workspace = true
authors.workspace = true
description = "Nginx web server configuration language parser with support for web server configuration and routing processing."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "nginx", "configuration", "web-server"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }



[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
