[package]
name = "data-text-org-mode"
version.workspace = true
authors.workspace = true
description = "Org-mode parser with support for Emacs org-mode syntax and features."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-org-mode"
categories = ["parsing"]
keywords = ["parser", "org-mode", "emacs", "documentation"]

[dependencies]
data-text-core = { workspace = true }
language-highlight = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

tokio = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "language-highlight", "language-format", "dep:futures"]
mcp = ["lsp", "language-mcp/io-std", "io-std"]
io-std = []

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
