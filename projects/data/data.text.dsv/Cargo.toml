[package]
name = "data-text-dsv"
version.workspace = true
authors.workspace = true
description = "High-performance incremental DSV (Delimiter-Separated Values) parser for the `data.text` family with flexible configuration, optimized for data parsing and tabular data processing."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "dsv", "csv", "tsv", "data"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
