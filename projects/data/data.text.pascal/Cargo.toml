[package]
name = "data-text-pascal"
version.workspace = true
authors.workspace = true
description = "Pascal programming language parser with support for structured programming and modern Pascal dialects."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "pascal", "imperative"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }
data-text-json = { workspace = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde", "data-text-json/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
