[package]
name = "data-text-metis"
version.workspace = true
authors.workspace = true
description = "Metis island language parser (CST) for the oak ecosystem"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-metis"
categories = ["parsing"]
keywords = ["parser", "metis", "island", "cas"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = []
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
