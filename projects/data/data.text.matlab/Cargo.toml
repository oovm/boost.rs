[package]
name = "data-text-matlab"
version.workspace = true
authors.workspace = true
description = "MATLAB numerical computing language parser with support for scientific computing, data analysis, and visualization."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "matlab", "scientific", "computing"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
