[package]
name = "data-text-stylus"
description = "Stylus language support for `data.text` framework"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
data-text-core = { workspace = true }
triomphe = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
