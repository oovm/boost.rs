[package]
name = "data-text-stylus"
description = "Stylus language support for `data.text` framework"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
data-text-core = { workspace = true }
triomphe = { workspace = true }
serde = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net"] }
language-highlight = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "dep:language-highlight", "dep:futures", "dep:language-format"]
mcp = ["lsp", "dep:tokio", "dep:language-mcp"]
language-highlight = ["dep:language-highlight"]
language-format = ["dep:language-format"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
