[package]
name = "data-text-purescript"
version.workspace = true
authors.workspace = true
description = "PureScript language parser with support for functional programming and strong type system features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "purescript", "functional", "type-safe"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
