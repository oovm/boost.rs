[package]
name = "data-binary-docx"
version.workspace = true
authors.workspace = true
description = "DOCX OPC package indexer built on `data.binary` ZIP."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
[dependencies]
data-binary-core = { workspace = true }
boost-source = { workspace = true }
data-binary-zip = { workspace = true }
data-text-xml = { workspace = true, default-features = false, features = ["serde"] }

[dev-dependencies]
data-compression = { workspace = true, features = ["deflate"] }
