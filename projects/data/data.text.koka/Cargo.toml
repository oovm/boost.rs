[package]
name = "data-text-koka"
version.workspace = true
authors.workspace = true
description = "Koka frontend for `data.text`"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["compilers", "development-tools"]
keywords = ["frontend", "language", "koka"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[[test]]
name = "main"
required-features = ["serde"]
