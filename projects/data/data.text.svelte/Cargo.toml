[package]
name = "data-text-svelte"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Svelte parser for the `data.text` family."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "svelte", "incremental"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[[test]]
name = "main"
required-features = ["serde"]
