[package]
name = "data-text-vhdl"
version.workspace = true
authors.workspace = true
description = "VHDL language parser with support for hardware description and digital circuit design."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing", "hardware-support"]
keywords = ["parser", "vhdl", "hardware", "hdl", "digital-circuit"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
