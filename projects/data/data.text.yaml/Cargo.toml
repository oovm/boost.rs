[package]
name = "data-text-yaml"
version.workspace = true
authors.workspace = true
description = "High-performance incremental YAML parser for the `data.text` family with flexible configuration, optimized for configuration files and data serialization."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "yaml", "configuration", "serialization"]

[dependencies]
data-text-core = { workspace = true }
language-highlight = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true, features = ["io-std"] }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "language-highlight", "language-format", "dep:futures"]
mcp = ["lsp", "language-mcp/io-std", "dep:tokio"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
