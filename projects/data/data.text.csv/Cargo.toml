[package]
name = "data-text-csv"
version.workspace = true
authors.workspace = true
description = "High-performance incremental CSV parser for the `data.text` family with flexible configuration, optimized for data parsing and tabular data processing."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "csv", "data", "tabular"]

[dependencies]
data-text-core = { workspace = true }
data-text-dsv = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
