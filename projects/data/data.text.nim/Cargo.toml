[package]
name = "data-text-nim"
version.workspace = true
authors.workspace = true
description = "Nim language parser with support for modern Nim syntax and systems programming features."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "nim", "systems-programming", "compiled"]

[dependencies]
data-text-core = { workspace = true }
language-highlight = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
dashmap = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "language-highlight", "language-format", "dep:futures", "dep:tokio"]
mcp = ["lsp", "language-mcp/io-std"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
