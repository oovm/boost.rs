[package]
name = "data-text-rbq"
version.workspace = true
authors.workspace = true
description = "High-performance incremental RBQ parser for the `data.text` family."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "rbq", "streaming", "validation"]

[dependencies]
data-text-core = { workspace = true }
language-highlight = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
language-folding = { workspace = true, optional = true }
language-semantic-tokens = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
language-navigation = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }
language-macro = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
language-format = ["dep:language-format"]
lsp = ["dep:language-server", "dep:language-hover", "dep:language-folding", "dep:language-semantic-tokens", "dep:language-navigation", "dep:dashmap", "language-highlight", "language-format", "dep:futures"]
mcp = ["lsp", "language-mcp/io-std"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
