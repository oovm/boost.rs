[package]
name = "data-text-mdl"
version.workspace = true
authors.workspace = true
description = "MDL molfile and SDF connection-table parser for the `data.text` family."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "mdl", "molfile", "sdf", "cheminformatics"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
