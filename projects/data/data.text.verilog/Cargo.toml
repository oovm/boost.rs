[package]
name = "data-text-verilog"
version.workspace = true
authors.workspace = true
description = "Verilog language parser with support for modern Verilog syntax and features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "verilog", "language"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[[test]]
name = "main"
required-features = ["serde"]
