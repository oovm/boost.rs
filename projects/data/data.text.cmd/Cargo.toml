[package]
name = "data-text-cmd"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Windows Command (CMD) parser for the `data.text` family with flexible configuration, supporting shell scripting and automation workflows."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "cmd", "command", "windows"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
