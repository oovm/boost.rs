[package]
name = "data-text-dejavu"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Dejavu parser for the `data.text` family with flexible configuration."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "dejavu", "experimental"]

[dependencies]
data-text-core = { workspace = true }
language-macro = { workspace = true }
language-highlight = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
arcstr.workspace = true
indexmap.workspace = true
im-rc.workspace = true
num.workspace = true
bigdecimal.workspace = true
unicode-ident.workspace = true

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "language-highlight", "dep:futures"]
mcp = ["lsp", "language-mcp/io-std"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
