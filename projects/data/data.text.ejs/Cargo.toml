[package]
name = "data-text-ejs"
version.workspace = true
authors.workspace = true
description = "EJS template language for `data.text`"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing", "template-engine"]
keywords = ["parser", "ejs", "template", "syntax-analysis"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
data-text-typescript = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[[test]]
name = "main"
required-features = ["serde"]
