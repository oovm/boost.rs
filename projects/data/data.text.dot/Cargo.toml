[package]
name = "data-text-dot"
version.workspace = true
authors.workspace = true
description = "High-performance incremental DOT language parser for the `data.text` family with flexible configuration, optimized for graph description and visualization."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "dot", "graph", "visualization"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
