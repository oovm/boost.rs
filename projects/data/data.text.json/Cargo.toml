[package]
name = "data-text-json"
version.workspace = true
authors.workspace = true
description = "High-performance incremental JSON parser for the `data.text` family with flexible configuration, optimized for data interchange and configuration files."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "json", "streaming", "validation"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
language-macro = { workspace = true }
triomphe = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde", "dep:serde_json"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
