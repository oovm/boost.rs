[package]
name = "data-text-django"
version.workspace = true
authors.workspace = true
description = "Django template parser with support for Django template language and web development."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "django", "template", "web"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }



[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
