[package]
name = "data-text-java"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Java language parser for the `data.text` family with flexible configuration, supporting modern Java features and object-oriented programming."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "java", "language", "syntax-analysis"]

[dependencies]
data-text-core = { workspace = true }
# data-text-javadoc = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
