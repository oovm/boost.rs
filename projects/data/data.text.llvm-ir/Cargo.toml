[package]
name = "data-text-llvm-ir"
version.workspace = true
authors.workspace = true
description = "High-performance incremental LLVM IR parser for the `data.text` family with flexible configuration, supporting low-level intermediate representation analysis."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "llvm", "ir", "syntax-analysis"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
