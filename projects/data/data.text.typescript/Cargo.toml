[package]
name = "data-text-typescript"
version.workspace = true
authors.workspace = true
description = "TypeScript frontend for `data.text`"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["compilers", "development-tools"]
keywords = ["frontend", "language", "typescript"]

[dependencies]
data-text-core = { workspace = true }
data-text-formatter = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]


