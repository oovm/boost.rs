[package]
name = "data-text-jinja"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Jinja2 parser for the `data.text` family with flexible configuration, supporting template rendering and syntax analysis."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing", "template-engine"]
keywords = ["parser", "jinja", "template", "syntax-analysis"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
