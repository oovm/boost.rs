[package]
name = "data-text-pretty"
version.workspace = true
authors.workspace = true
description = "Document algebra and pretty-print renderer shared by the data.text printers."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["text-processing"]
keywords = ["pretty-print", "document", "formatting"]

[dependencies]
data-text-core = { workspace = true }
language-macro = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
