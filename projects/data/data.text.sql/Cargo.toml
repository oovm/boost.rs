[package]
name = "data-text-sql"
version.workspace = true
authors.workspace = true
description = "SQL database query language parser with support for standard SQL syntax and database operations."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "sql", "database", "query"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
