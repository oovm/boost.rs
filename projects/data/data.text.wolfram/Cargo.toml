[package]
name = "data-text-wolfram"
version.workspace = true
authors.workspace = true
description = "Wolfram Language parser with support for Mathematica syntax and symbolic computation."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "wolfram", "mathematica", "symbolic"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
