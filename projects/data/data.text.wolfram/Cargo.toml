[package]
name = "data-text-wolfram"
version.workspace = true
authors.workspace = true
description = "Wolfram Language parser with support for Mathematica syntax and symbolic computation."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-wolfram"
categories = ["parsing"]
keywords = ["parser", "wolfram", "mathematica", "symbolic"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
language-highlight = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "language-highlight", "language-format", "dep:futures"]
mcp = ["lsp", "language-mcp/io-std", "dep:tokio"]

[package.metadata.docs.rs]
all-features = true
