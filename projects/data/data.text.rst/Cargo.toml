[package]
name = "data-text-rst"
version.workspace = true
authors.workspace = true
description = "High-performance incremental reStructuredText parser for the `data.text` family."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "restructuredtext", "rst", "extension"]

[dependencies]
data-text-core = { workspace = true }
language-server = { workspace = true, optional = true }
language-hover = { workspace = true, optional = true }
language-navigation = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true, optional = true }
language-highlight = { workspace = true, optional = true }
language-format = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
language-mcp = { workspace = true, optional = true }

tokio = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
lsp = ["dep:language-server", "dep:language-hover", "language-highlight", "language-format", "dep:futures", "dep:tokio"]
mcp = ["lsp", "dep:language-mcp", "language-mcp/io-std", "io-std"]
io-std = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
