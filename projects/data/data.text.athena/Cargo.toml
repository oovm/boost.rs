[package]
name = "data-text-athena"
version.workspace = true
authors.workspace = true
description = "Athena expression-language parser for Oak (renamed from oak-simple-math). Lowercase calls, lists, dicts."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-athena"
categories = ["parsing"]
keywords = ["parser", "athena", "simple-math", "dsl", "symbolic", "oak"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
