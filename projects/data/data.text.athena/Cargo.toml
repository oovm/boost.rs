[package]
name = "data-text-athena"
version.workspace = true
authors.workspace = true
description = "Athena expression-language parser. Lowercase calls, lists, dicts."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "athena", "simple-math", "dsl", "symbolic", "text"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true
