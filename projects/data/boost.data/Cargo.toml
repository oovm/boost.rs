[package]
name = "boost-data"
version.workspace = true
authors.workspace = true
description = "Feature-gated entry crate for the data.text, data.binary, data.encoding, data.checksum and data.compression families."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["parsing", "encoding"]
keywords = ["text", "binary", "encoding", "compression"]

[dependencies]
data-text-core = { workspace = true, optional = true }
data-binary-core = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
data-checksum = { workspace = true, optional = true }
data-compression = { workspace = true, optional = true }

[features]
default = []
text = ["dep:data-text-core"]
binary = ["dep:data-binary-core"]
encoding = ["dep:data-encoding"]
checksum = ["dep:data-checksum"]
compression = ["dep:data-compression"]
all = ["text", "binary", "encoding", "checksum", "compression"]
