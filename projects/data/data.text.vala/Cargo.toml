[package]
name = "data-text-vala"
version.workspace = true
authors.workspace = true
description = "Vala object-oriented programming language parser with support for GObject-based programming and modern syntax features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "vala", "gobject", "gtk"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
