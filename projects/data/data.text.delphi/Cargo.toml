[package]
name = "data-text-delphi"
version.workspace = true
authors.workspace = true
description = "Delphi language parser with support for modern Delphi syntax and object-oriented programming features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "delphi", "object-oriented", "pascal"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
