[package]
name = "data-text-glsl"
version.workspace = true
authors.workspace = true
description = "GLSL language parser with support for modern OpenGL and Vulkan shader programming."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-glsl"
categories = ["parsing"]
keywords = ["parser", "glsl", "shader", "opengl"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
