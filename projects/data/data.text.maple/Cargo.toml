[package]
name = "data-text-maple"
version.workspace = true
authors.workspace = true
description = "Maple expression language parser for `data.text`."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "maple", "symbolic", "text"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
