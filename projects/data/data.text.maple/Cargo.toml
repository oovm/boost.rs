[package]
name = "data-text-maple"
version.workspace = true
authors.workspace = true
description = "Maple expression language parser for Oak."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-maple"
categories = ["parsing"]
keywords = ["parser", "maple", "symbolic", "oak"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
