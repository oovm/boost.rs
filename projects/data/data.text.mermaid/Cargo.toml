[package]
name = "data-text-mermaid"
version.workspace = true
authors.workspace = true
description = "Mermaid diagramming language parser for `data.text`"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[dependencies]
data-text-core = { workspace = true }
data-text-uml = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde", "data-text-uml/serde"]

[[test]]
name = "main"
required-features = ["serde"]
