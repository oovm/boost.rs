[package]
name = "data-text-powershell"
version.workspace = true
authors.workspace = true
description = "PowerShell script parser with support for modern PowerShell syntax and cmdlets."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "powershell", "scripting", "windows"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
