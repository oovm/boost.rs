[package]
name = "data-text-symbols"
version.workspace = true
authors.workspace = true
description = "Symbol extraction and management for Boost."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["development-tools"]
keywords = ["symbols", "extraction", "indexing"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
