[package]
name = "data-text-d2"
version.workspace = true
authors.workspace = true
description = "D2 diagramming language parser for `data.text`"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lib]
path = "src/lib.rs"

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
