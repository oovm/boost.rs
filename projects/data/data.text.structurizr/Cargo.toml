[package]
name = "data-text-structurizr"
version.workspace = true
authors.workspace = true
description = "Structurizr DSL parser for `data.text`"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[dependencies]
data-text-core = { workspace = true }
data-text-c4 = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde", "data-text-c4/serde"]

[[test]]
name = "main"
required-features = ["serde"]
