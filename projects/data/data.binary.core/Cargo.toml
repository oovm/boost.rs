[package]
name = "data-binary-core"
version.workspace = true
authors.workspace = true
description = "Address spaces, byte extents, layout graphs, parse budgets, bit cursors, and write plans for the data.binary family."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["binary", "parser", "layout"]

[dependencies]
boost-harness = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "boost-harness/serde"]

[package.metadata.docs.rs]
all-features = true
