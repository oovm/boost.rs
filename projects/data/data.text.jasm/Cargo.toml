[package]
name = "data-text-jasm"
version.workspace = true
authors.workspace = true
description = "JASM assembly language parser with support for modern assembly syntax and features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "jasm", "assembly-language", "syntax"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
