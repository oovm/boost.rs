[package]
name = "data-text-valkyrie"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Valkyrie parser for the oak ecosystem with flexible configuration."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
documentation = "https://docs.rs/oak-valkyrie"
categories = ["parsing"]
keywords = ["parser", "valkyrie", "experimental"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
data-text-dejavu = { workspace = true }
data-text-formatter = { workspace = true }
serde = { workspace = true, optional = true, features = ["unstable"]}
unicode-ident = { workspace = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
