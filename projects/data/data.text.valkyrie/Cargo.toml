[package]
name = "data-text-valkyrie"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Valkyrie parser for the `data.text` family with flexible configuration."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "valkyrie", "experimental"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
data-text-dejavu = { workspace = true }
serde = { workspace = true, optional = true, features = ["unstable"]}
unicode-ident = { workspace = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
