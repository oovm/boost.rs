[package]
name = "data-binary-ttf"
version.workspace = true
authors.workspace = true
description = "SFNT font parser: table directory, standard tables, MATH table, TrueType glyf and OTF CFF outlines"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["parsing", "graphics"]
keywords = ["font", "sfnt", "truetype", "opentype", "math"]

[dependencies]
data-binary-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "data-binary-core/serde"]
diff-ttf-parser = ["dep:ttf-parser"]
outline-cff = ["dep:ttf-parser"]

[dependencies.ttf-parser]
version = "0.21"
optional = true
default-features = false
features = ["opentype-layout", "apple-layout", "variable-fonts", "glyph-names"]

[dev-dependencies]
ttf-parser = "0.21"

[package.metadata.docs.rs]
all-features = true
