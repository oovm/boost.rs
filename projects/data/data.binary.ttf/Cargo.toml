[package]
name = "data-binary-ttf"
version.workspace = true
authors.workspace = true
description = "SFNT font parser: table directory, standard tables, MATH table, TrueType glyf and OTF CFF outlines"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing", "graphics"]
keywords = ["font", "sfnt", "truetype", "opentype", "math"]

[dependencies]
data-binary-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "data-binary-core/serde"]

[package.metadata.docs.rs]
all-features = true
