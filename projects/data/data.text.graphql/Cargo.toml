[package]
name = "data-text-graphql"
version.workspace = true
authors.workspace = true
description = "GraphQL query language parser with support for modern GraphQL specifications and schema definitions."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "graphql", "query-language", "api"]

[dependencies]
data-text-core = { workspace = true }

serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
