[package]
name = "data-text-html"
version.workspace = true
authors.workspace = true
description = "HTML markup language parser with support for web content and document structure processing."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "html", "web", "markup"]

[dependencies]
data-text-core = { workspace = true }
data-text-css-selector = { workspace = true }
serde = { workspace = true, optional = true }

[lib]
path = "src/lib.rs"

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
