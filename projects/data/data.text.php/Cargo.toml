[package]
name = "data-text-php"
version.workspace = true
authors.workspace = true
description = "PHP server-side scripting language parser with support for web development and modern PHP features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "php", "web-development", "scripting"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
