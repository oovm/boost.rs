[package]
name = "data-text-wat"
version.workspace = true
authors.workspace = true
description = "WebAssembly Text (WAT) language parser with support for web platform development and portable code generation."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "wat", "webassembly", "wasm"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
