[package]
name = "data-text-tailwind"
version.workspace = true
authors.workspace = true
description = "Tailwind CSS parser with support for modern template syntax and features."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "tailwind", "template", "templating"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }
lazy_static = { workspace = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
