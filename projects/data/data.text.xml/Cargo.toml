[package]
name = "data-text-xml"
version.workspace = true
authors.workspace = true
description = "High-performance incremental XML parser for the `data.text` family with flexible configuration."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "xml", "markup", "document"]

[dependencies]
data-text-core = { workspace = true }
data-text-xpath = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
diagnostic = ["data-text-core/diagnostic"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
