[package]
name = "data-text-dockerfile"
version.workspace = true
authors.workspace = true
description = "Dockerfile container configuration language parser with support for container image building and management."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "dockerfile", "docker", "container"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }


[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
