[package]
name = "data-text-msil"
version.workspace = true
authors.workspace = true
description = "Microsoft Intermediate Language (MSIL) parser with support for .NET Common Language Infrastructure and bytecode analysis."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["parsing"]
keywords = ["parser", "msil", "cil", "dotnet", "bytecode"]

[dependencies]
data-text-core = { workspace = true }
data-text-pretty = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
language-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
