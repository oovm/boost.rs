# `database-storage` owns actual reads/writes, locks, snapshots, checkpoints, recovery and object storage.
[package]
name = "database-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
data-encoding = { workspace = true }
blake3 = { workspace = true }
boost-collection = { workspace = true }
boost-math = { workspace = true }
boost-random = { workspace = true, features = ["system"] }
database-cluster = { workspace = true }
database-formats = { workspace = true }
database-protocol-mongo = { workspace = true }
database-protocol-pgsql = { workspace = true }
database-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
