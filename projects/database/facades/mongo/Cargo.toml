[package]
name = "mongo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MongoDB facade: document store, cursors, oplog and command semantics over an abstract storage backend"
publish = false
readme = "readme.md"

[lib]
path = "src/lib.rs"

[features]
default = ["storage"]
# `.yykv` / `.yyds` 文档存储与命令语义。只做 BSON / JSON / wire 编解码的
# wasm 目标关闭它，避免把 `std::fs` 编进目标。
storage = ["dep:database-execution", "dep:database-formats", "dep:database-storage"]

[dependencies]
database-execution = { workspace = true, optional = true }
database-formats = { workspace = true, optional = true }
database-protocol-mongo = { workspace = true }
database-types = { workspace = true }
database-storage = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
