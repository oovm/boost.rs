[package]
name = "athena-testing"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
description = "Athena neutral test helpers — builders, asserts, and lib contract checks"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
athena = { workspace = true }
athena-types = { workspace = true }
athena-gc = { workspace = true }
athena-numeric = { workspace = true }
athena-ir = { workspace = true }
athena-rewriter = { workspace = true }
athena-engine = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
