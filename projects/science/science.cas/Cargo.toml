[package]
name = "science-cas"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
description = "Science CAS execution engine — Session, eval, rewrite orchestration"
publish = false

[features]
default = ["portable"]
portable = []
jit = ["dep:science-jit"]

[dependencies]
science-types = { workspace = true }
science-gc = { workspace = true }
science-numeric = { workspace = true }
science-ir = { workspace = true }
science-rewrite = { workspace = true }
science-vm = { workspace = true }
science-jit = { workspace = true, optional = true }
science-graph = { workspace = true }
science-ndarray = { workspace = true }
plotter = { workspace = true }

[dev-dependencies]
science-harness = { workspace = true }

[lints.rust]
missing_docs = "warn"
# `deny`（非 `forbid`）：`DomainExecutionContext` 经独占生命周期裸指针消除嵌套 builder E0499。
unsafe_code = "deny"
