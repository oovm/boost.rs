[package]
name = "science-numeric"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
description = "Science numeric tower — values, domains, precision, promotion, certificates"
publish = false

[features]
default = ["portable"]
portable = []
# Batch-local `TemporaryNatural` / `TemporaryInteger`（历史别名 `Ephemeral*`）。
ephemeral = []

[[test]]
name = "ephemeral_batch"
path = "tests/ephemeral_batch.rs"
required-features = ["ephemeral"]

[dependencies]
science-types = { workspace = true }
science-gc = { workspace = true }

[lints.rust]
missing_docs = "warn"
# Magnitude union / OwnedLimbBuffer 需要窄域 unsafe；其余模块保持 deny。
unsafe_code = "deny"
