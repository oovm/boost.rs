[package]
name = "boost-text"
version.workspace = true
authors.workspace = true
description = "Feature-gated entry crate for the data.text core, symbols, source-map and VOS families."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["parsing", "text-processing"]
keywords = ["text", "syntax", "symbols", "vos"]

[dependencies]
data-text-core = { workspace = true, optional = true }
data-text-symbols = { workspace = true, optional = true }
data-text-source-map = { workspace = true, optional = true }
data-text-vos = { workspace = true, optional = true }

[features]
default = []
core = ["dep:data-text-core"]
symbols = ["dep:data-text-symbols"]
source-map = ["dep:data-text-source-map"]
vos = ["dep:data-text-vos"]
all = ["core", "symbols", "source-map", "vos"]
