[package]
name = "boost-net"
version.workspace = true
authors.workspace = true
description = "Protocol-layer network primitives: HTTP/1.1 and WebSocket over TCP with optional TLS versions"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost.net"
documentation = "https://docs.rs/boost-net"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
# `url` is pinned locally so the no_std build does not inherit the workspace
# `serde` feature, which needs an allocator-aware serde build.
url = { version = "2.5.8", default-features = false }
boost-random = { workspace = true, optional = true }
boost-crypto = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = ["std", "tls"]
std = ["dep:boost-random", "dep:boost-crypto", "dep:base64", "url/std"]
tls = ["std", "dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
boost-crypto = { workspace = true }
base64 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
