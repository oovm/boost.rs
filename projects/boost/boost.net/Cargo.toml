[package]
name = "boost-net"
version.workspace = true
authors.workspace = true
description = "Protocol-layer network primitives: HTTP/1.1 and WebSocket over TCP with optional TLS versions"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost.net"
documentation = "https://docs.rs/boost-net"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
# 继承 workspace 版本；关闭 default features 以保持 no_std 构建，
# 公共条目不带 `serde`，std 消费者各自本地声明。
url = { workspace = true, default-features = false }
boost-random = { workspace = true, optional = true }
boost-crypto = { workspace = true, optional = true }
data-binary-asn1 = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ml-kem = { workspace = true, optional = true }

[features]
default = ["std", "tls"]
std = ["dep:boost-random", "dep:boost-crypto", "dep:data-encoding", "dep:serde_json", "url/std"]
tls = ["std", "dep:data-binary-asn1", "dep:ml-kem"]

[dev-dependencies]
boost-crypto = { workspace = true }
data-encoding = { workspace = true }

[package.metadata.docs.rs]
all-features = true
