[package]
name = "boost-crypto"
version.workspace = true
authors.workspace = true
description = "Shared cryptographic primitives for the boost family: hashing, MAC and HKDF, AEAD, ECDSA and RSA signatures, X25519 key exchange, encodings, and secret material lifetimes"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost.crypto"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
boost-random = { workspace = true, features = ["std", "system"] }
sha2 = { workspace = true }
sha2-rsa = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
rsa = { workspace = true }
signature = { workspace = true }
x25519-dalek = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
rand_core = { workspace = true }

[package.metadata.docs.rs]
all-features = true
