[package]
name = "boost"
version.workspace = true
authors.workspace = true
description = "Feature-gated facade for orthogonal Rust standard-library enhancements (harness, console, diagnostic, source, …)"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost"
readme = "readme.md"
license.workspace = true
edition.workspace = true
keywords = ["boost", "stdlib", "facade", "logging", "diagnostic", "testing"]
categories = ["development-tools"]

[dependencies]
boost-collection = { workspace = true, optional = true }
boost-collection-macro = { workspace = true, optional = true }
boost-console = { workspace = true, optional = true }
boost-crypto = { workspace = true, optional = true }
boost-fs = { workspace = true, optional = true }
boost-harness = { workspace = true, optional = true }
boost-harness-macro = { workspace = true, optional = true }
boost-random = { workspace = true, optional = true }
boost-source = { workspace = true, optional = true }
boost-terminal = { workspace = true, optional = true }

[features]
default = []
benchmark = ["dep:boost-harness"]
collection = ["dep:boost-collection", "dep:boost-collection-macro"]
console = ["dep:boost-console", "dep:boost-harness"]
crypto = ["dep:boost-crypto"]
diagnostic = ["dep:boost-harness"]
fmt = ["dep:boost-console"]
fs = ["dep:boost-fs"]
log = ["dep:boost-harness"]
random = ["dep:boost-random"]
source = ["dep:boost-source"]
terminal = ["dep:boost-terminal"]
test = ["dep:boost-harness", "dep:boost-harness-macro"]

[[test]]
name = "facade_test_macro"
required-features = ["test"]

[[test]]
name = "facade_collection_macro"
required-features = ["collection"]

[package.metadata.docs.rs]
all-features = true
