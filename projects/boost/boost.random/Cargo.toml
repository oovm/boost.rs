[package]
name = "boost-random"
version.workspace = true
authors.workspace = true
description = "Deterministic random streams with a frozen output profile, unbiased sampling, and owned host entropy backends"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost-random"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
boost-math = { workspace = true, default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2.95", optional = true }

[features]
default = []
std = []
system = []
web = ["dep:wasm-bindgen"]

[package.metadata.docs.rs]
all-features = true
