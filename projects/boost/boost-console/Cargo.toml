[package]
name = "boost-console"
version.workspace = true
authors.workspace = true
description = "Terminal text styling primitives for human-visible console output"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost-console"
readme = "readme.md"
license.workspace = true
edition.workspace = true
keywords = ["console", "terminal", "stderr", "style", "ansi"]
categories = ["development-tools"]

[dev-dependencies]
serial_test = { workspace = true }

[features]
default = ["fmt"]
fmt = []
concolor = []

[package.metadata.docs.rs]
all-features = true
