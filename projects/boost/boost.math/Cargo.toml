[package]
name = "boost-math"
version.workspace = true
authors.workspace = true
description = "Mathematical objects and numerical contracts for the boost family: arbitrary-precision integers, graph theory, and owned scalar kernels"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/boost.math"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
boost-collection = { workspace = true, optional = true }

[features]
default = ["std"]
# 图论算法消费 `boost-collection` 的图访问能力，因此需要宿主标准库。
std = ["dep:boost-collection"]

[package.metadata.docs.rs]
all-features = true
