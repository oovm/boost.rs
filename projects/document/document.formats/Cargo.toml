[package]
name = "document-formats"
version.workspace = true
authors.workspace = true
description = "文档格式 import / export（Markdown / Notedown / DOCX / …）"
repository = "https://github.com/notedge/document.rs"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
boost-collection = { workspace = true }
boost-harness = { workspace = true }
boost-math = { workspace = true }
document-ir = { workspace = true }
data-compression = { workspace = true, optional = true, features = ["deflate"] }
blake3 = { workspace = true, optional = true }
data-text-core = { workspace = true, optional = true }
data-text-markdown = { workspace = true, optional = true }
data-text-notedown = { workspace = true, optional = true }
data-binary-core = { workspace = true, optional = true }
data-binary-doc = { workspace = true, optional = true }
data-binary-docx = { workspace = true, optional = true }
data-binary-epub = { workspace = true, optional = true }
data-text-html = { workspace = true, optional = true }
data-text-xml = { workspace = true, optional = true }
data-text-tex = { workspace = true, optional = true }
data-text-typst = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["markdown"]
markdown = ["dep:data-text-core", "dep:data-text-markdown", "html"]
notedown = ["dep:data-text-core", "dep:data-text-notedown"]
docx = ["dep:data-binary-core", "dep:data-binary-docx", "dep:data-text-core", "dep:data-text-xml", "tex"]
xlsx = ["dep:data-binary-core", "dep:data-binary-docx", "dep:data-text-core", "dep:data-text-xml"]
pptx = ["dep:data-binary-core", "dep:data-binary-docx", "dep:data-text-core", "dep:data-text-xml"]
doc = ["dep:data-binary-doc"]
pdf = ["dep:data-compression"]
epub = ["dep:data-binary-core", "dep:data-binary-epub", "dep:data-text-core", "dep:data-text-html", "dep:data-text-xml", "dep:blake3", "tex"]
html = ["dep:data-text-core", "dep:data-text-html", "dep:blake3", "tex"]
tex = ["dep:data-text-core", "dep:data-text-tex"]
typst = ["dep:data-text-core", "dep:data-text-typst"]
pandoc-json = ["dep:serde_json"]

