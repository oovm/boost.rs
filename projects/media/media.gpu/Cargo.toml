[package]
name = "media-gpu"
description = "GPU compositor backend: D3D12 compute operators that reproduce the CPU reference on packed RGBA8 display bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
media-image = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
hardware-backend-dx12 = { workspace = true, optional = true }
hardware-emitter = { workspace = true, optional = true }
hardware-ir = { workspace = true, optional = true }
hardware-program = { workspace = true, optional = true }
hardware-scheduler = { workspace = true, optional = true }
hardware-types = { workspace = true, optional = true }

[features]
default = ["dx12"]
# The production path: UCF kernels emitted to DXBC and dispatched by the
# in-tree D3D12 backend (合同 14 §1.2).
dx12 = [
    "dep:hardware-backend-dx12",
    "dep:hardware-ir",
    "dep:hardware-program",
    "dep:hardware-scheduler",
    "dep:hardware-types",
    "dep:media-image",
]
# Historical feature name kept for hosts that enable it explicitly; it now
# selects the same D3D12 path.
gpu = ["dx12"]
# Build-time WGSL emission: the same UCF kernels emitted through the text ABI
# plus the binding manifest, for Web/WASM hosts. No GPU or D3D12 needed.
wgsl = ["dep:hardware-emitter", "dep:hardware-program"]

[dev-dependencies]
geometry = { workspace = true }
media-raster = { workspace = true }
media-post = { workspace = true }
