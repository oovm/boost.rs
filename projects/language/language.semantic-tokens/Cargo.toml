[package]
name = "language-semantic-tokens"
version.workspace = true
authors.workspace = true
description = "Semantic syntax highlighting and token classification for the Oak framework."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["development-tools"]
keywords = ["semantic-tokens", "highlighting", "lsp"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde", "data-text-core/serde"]
default = ["serde"]
