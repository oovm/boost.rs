[package]
name = "language-valkyrie"
description = "Valkyrie language implementation: type model, HIR, MIR, semantic analysis and target adaptation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
serde = ["compiler-types/serde"]

[dependencies]
document-formats = { workspace = true }
data-binary-dex = { workspace = true }
data-binary-host = { workspace = true }
data-binary-jvm = { workspace = true }
data-binary-mach-o = { workspace = true }
data-binary-odin = { workspace = true }
data-binary-pe = { workspace = true }
data-binary-wasm = { workspace = true }
data-binary-x64 = { workspace = true }
data-binary-zip = { workspace = true }
boost-collection = { workspace = true }
boost-harness = { workspace = true }
boost-math = { workspace = true }
compiler-analysis = { workspace = true }
compiler-emitter = { workspace = true }
compiler-target = { workspace = true }
compiler-types = { workspace = true }
interpreter-vm-ovm = { workspace = true }
data-text-core = { workspace = true }
language-format = { workspace = true, features = ["serde"] }
language-highlight = { workspace = true }
data-text-valkyrie = { workspace = true }
package-registry = { workspace = true }
package-resolve = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
boost-fs = { workspace = true }
