[package]
name = "language-navigation"
version.workspace = true
authors.workspace = true
description = "Symbol navigation, definition lookup, and reference tracking for Boost."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["development-tools"]
keywords = ["navigation", "goto-definition", "references"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "data-text-core/serde"]
