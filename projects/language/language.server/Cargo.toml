[package]
name = "language-server"
version.workspace = true
authors.workspace = true
description = "Lightweight LSP types for Boost"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["development-tools"]
keywords = ["lsp", "language-server", "types"]

[dependencies]
boost-harness = { workspace = true, features = ["serde", "terminal"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true }
dashmap = { workspace = true }
url = { workspace = true, features = ["serde"] }
data-text-core = { workspace = true, features = ["serde", "vfs", "vfs-disk"] }
data-text-symbols = { workspace = true }
data-text-resolver = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = [ "serde"]
serde = ["dep:serde", "dep:serde_json", "data-text-core/serde"]
