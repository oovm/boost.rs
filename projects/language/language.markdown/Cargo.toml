[package]
name = "language-markdown"
version.workspace = true
authors.workspace = true
description = "Language services for Markdown (LSP, MCP, formatter, highlighter adapters over data-text-markdown)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["development-tools"]
keywords = ["lsp", "mcp", "markdown"]

[dependencies]
data-text-core = { workspace = true }
data-text-markdown = { workspace = true }
futures = { workspace = true }
language-hover = { workspace = true }
language-mcp = { workspace = true }
language-navigation = { workspace = true }
language-server = { workspace = true }
tokio = { workspace = true }
[features]
default = ["io-std"]
io-std = ["language-mcp/io-std"]
