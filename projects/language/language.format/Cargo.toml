[package]
name = "language-format"
description = "Cross-language formatting service: provider dispatch, document and range requests, configuration and versioned edits"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
serde = ["dep:serde", "data-text-von/serde"]

[dependencies]
data-text-awsl = { workspace = true }
data-text-core = { workspace = true }
data-text-von = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
