[package]
name = "language-folding"
version.workspace = true
authors.workspace = true
description = "Code folding logic and AST-based region detection for Boost."
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
publish.workspace = true
categories = ["development-tools"]
keywords = ["folding", "code-folding", "ast"]

[dependencies]
data-text-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "data-text-core/serde"]
