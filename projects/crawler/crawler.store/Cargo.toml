[package]
name = "crawler-store"
version.workspace = true
authors.workspace = true
description = "Crawler persistence store contract with MemoryStore and optional YydbStore"
readme = "readme.md"
homepage = "https://github.com/notedge/document.rs"
repository = "https://github.com/notedge/document.rs"
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
blake3 = { workspace = true }
boost-harness = { workspace = true }
crawler-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[features]
default = []
# `YydbStore` stays behind a feature, but the `yydb` crate is not a member of
# this workspace: its published revisions need a VOS semantic model that no
# longer shares a revision with the parser frontends here. Enabling this feature
# requires restoring that dependency deliberately, not silently.
yydb = []

