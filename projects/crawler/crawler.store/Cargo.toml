[package]
name = "crawler-store"
version.workspace = true
authors.workspace = true
description = "Crawler persistence store contract with MemoryStore and optional YydbStore"
readme = "readme.md"
homepage = "https://github.com/notedge/document.rs"
repository = "https://github.com/notedge/document.rs"
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
blake3 = { workspace = true }
boost-harness = { workspace = true }
crawler-types = { workspace = true }
database = { workspace = true, optional = true, default-features = false, features = ["execution"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true, features = ["serde"] }

[features]
default = []
# `YydbStore` consumes the in-workspace YYDB embedded engine through the
# `database` facade's `execution` capability. The dependency direction is a
# DAG: crawler (high-level consumer) depends on database, never the reverse.
yydb = ["dep:database"]

