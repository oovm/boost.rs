[package]
name = "commander-prompt"
version.workspace = true
authors.workspace = true
description = "Interactive prompt engine for the commander family: eligibility-gated confirm, input, select, password, and awaitAction over injected IO with stderr-only questions and action-required deferral"
repository = "https://github.com/oovm/rust-boost/tree/dev/projects/commander/commander.prompt"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
boost-terminal = { workspace = true }
commander-core = { workspace = true }
commander-types = { workspace = true }
serde_json = { workspace = true }

# Acceptance fixture CLI (the `commander.conformance/v0` Rust twin). It is a
# verification example, not part of the public library API. It lives here
# because binary targets only link regular dependencies, and the CLI needs
# both the routing facade and this prompt engine.
[[bin]]
name = "commander-conformance-cli"
path = "src/bin/commander_conformance_cli.rs"
