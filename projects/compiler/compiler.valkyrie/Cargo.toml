[package]
name = "compiler-valkyrie"
description = "Valkyrie language implementation: type model, HIR, MIR, semantic analysis and target adaptation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
serde = ["compiler-types/serde"]

[dependencies]
acorn-dex = { workspace = true }
acorn-host = { workspace = true }
acorn-jvm = { workspace = true }
acorn-mach-o = { workspace = true }
acorn-odin = { workspace = true }
acorn-pe = { workspace = true }
acorn-wasm = { workspace = true }
acorn-x64 = { workspace = true }
acorn-zip = { workspace = true }
base64 = { workspace = true }
boost-harness = { workspace = true }
compiler-analysis = { workspace = true }
compiler-emitter = { workspace = true }
compiler-target = { workspace = true }
compiler-types = { workspace = true }
interpreter-vm-ovm = { workspace = true }
oak-awsl = { workspace = true }
oak-core = { workspace = true }
language-format = { workspace = true, features = ["serde"] }
language-highlight = { workspace = true }
oak-valkyrie = { workspace = true }
oak-von = { workspace = true }
ordered-float = "5.5.0"
package-resolve = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
boost-fs = { workspace = true }
