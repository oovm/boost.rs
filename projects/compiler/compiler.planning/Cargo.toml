[package]
name = "compiler-planning"
description = "Target-side artifact partition planning, suspend control-flow payloads and rewrite theory manifests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[dependencies]
compiler-analysis = { workspace = true }
compiler-target = { workspace = true }
compiler-optimize = { workspace = true }
compiler-types = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
