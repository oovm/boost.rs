[package]
name = "compiler-emitter"
description = "Language-agnostic AOT assembly services: target input contracts, ABI structure and per-target private encoders for JVM, Wasm, CLR, OVM and machine targets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# 正式 OVM 字节码发射与执行路径；未启用时该目标不进入内置后端能力清单。
ovm-lane = []

[lints.rust]
missing_docs = "warn"

[dependencies]
data-binary-jvm = { workspace = true }
data-binary-odin = { workspace = true }
data-binary-pe = { workspace = true }
data-binary-wasm = { workspace = true }
boost-collection = { workspace = true }
boost-math = { workspace = true }
compiler-planning = { workspace = true }
compiler-target = { workspace = true }
compiler-types = { workspace = true, features = ["serde"] }
data-text-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
