[package]
name = "compiler-target"
description = "Language-neutral target resolution, artifact planning and backend registration contracts for compilers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[dependencies]
compiler-analysis = { workspace = true }
compiler-optimize = { workspace = true }
compiler-types = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
