unic-langid = "0.9.0"
lru = "0.7.0"
zeroize = { version = "1.9.1", features = ["derive"] }
sha2-rsa = { package = "sha2", version = "0.10.9", features = ["oid"] }
uuid = { version = "1", features = ["serde", "v4", "v7", "rng-getrandom"] }
once_cell = "1"
glob = "0.3"
libc = { version = "0.2", default-features = false }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
byteorder = "1.5.0"
encoding_rs = "0.8.35"

