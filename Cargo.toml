async-channel = "2.3.1"
futures-lite = "2.6.0"
pin-project-lite = "0.2.16"
fontdue = "0.9"
ttf-parser = { version = "0.21", default-features = false, features = ["opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }
libloading = "0.9.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
blake3 = { version = "1", features = ["pure"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.1", features = ["oid"] }
sha1-rsa = { package = "sha1", version = "0.10" }
rsa = { version = "0.9.10", features = ["sha2"] }
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.25"
unicode-normalization = "0.1"
fluent = "0.16.0"
fluent-syntax = "0.11.0"
fluent-bundle = "0.15.0"
unic-langid = "0.9.0"
zeroize = { version = "1.9.1", features = ["derive"] }
sha2-rsa = { package = "sha2", version = "0.10.9", features = ["oid"] }
uuid = { version = "1", features = ["serde", "v4", "v7", "rng-getrandom"] }
glob = "0.3"
libc = { version = "0.2", default-features = false }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
encoding_rs = "0.8.35"

[profile.release]
lto = true
panic = "abort"
