[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0 OR Apache-2.0"
repository = "https://github.com/oovm/rust-boost"
publish = false

[workspace.dependencies]
# 云服务与运行时装配
atlas = { path = "projects/atlas/atlas" }
atlas-cloud = { path = "projects/atlas/atlas.cloud" }
atlas-harness = { path = "projects/atlas/atlas.harness" }
